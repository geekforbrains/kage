[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kage-cli"
version = "0.2.0"
description = "Scriptable bridge for interactive AI CLIs (Claude Code, Codex, Gemini)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gavin Vickery", email = "gavin@geekforbrains.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["cli", "tmux", "claude", "codex", "gemini", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/geekforbrains/kage"
Repository = "https://github.com/geekforbrains/kage"
Issues = "https://github.com/geekforbrains/kage/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
kage = "kage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kage"]

[tool.hatch.build.targets.sdist]
include = ["src/kage", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
